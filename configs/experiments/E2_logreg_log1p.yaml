id: E2_logreg_log1p
family: logistic_regression
hypothesis: >-
  Las variables de volumen (sbytes, dbytes, spkts, rate, sload...) tienen asimetría
  > 30. Aplicar log1p antes de estandarizar hará la relación más lineal y
  class_weight=balanced reducirá el sesgo hacia la clase mayoritaria (ataque):
  se espera menos FPR y mejor macro-F1 que E1.
change: "Respecto a E1: log1p en numéricas y class_weight=balanced."
seed: 20261016
threshold: 0.5
preprocessing:
  numeric_transform: log1p
  scale: true
  categorical_encoding: onehot
model:
  type: logistic_regression
  params:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
