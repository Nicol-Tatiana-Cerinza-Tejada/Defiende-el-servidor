id: E4_hist_gb
family: trees
hypothesis: >-
  El boosting de histogramas corrige secuencialmente los errores y suele calibrar
  mejor las puntuaciones que el bosque; se espera macro-F1 similar o mejor que E3
  con un modelo mucho más liviano.
change: "Respecto a E3: HistGradientBoosting (lr=0.1, 300 iteraciones, 63 hojas, categorías nativas)."
seed: 20261016
threshold: 0.5
preprocessing:
  numeric_transform: none
  scale: false
  categorical_encoding: ordinal
model:
  type: hist_gradient_boosting
  params:
    learning_rate: 0.1
    max_iter: 300
    max_leaf_nodes: 63
    l2_regularization: 0.0
    early_stopping: false
