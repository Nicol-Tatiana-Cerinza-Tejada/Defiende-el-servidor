  \ asimetr\xEDa > 30. Aplicar log1p antes de estandarizar har\xE1 la relaci\xF3n\
  \ m\xE1s lineal y class_weight=balanced reducir\xE1 el sesgo hacia la clase mayoritaria\
  \ (ataque): se espera menos FPR y mejor macro-F1 que E1."
id: E2_logreg_log1p
model:
